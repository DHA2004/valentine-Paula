<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pregunta seria</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <main class="card" role="main">
      <img
        id="mainImg"
        class="hero"
        src="https://media1.tenor.com/m/CGQOSjUZ6ggAAAAd/corazon-de-minion-minion.gif"
        alt="Minion con corazón"
      />

      <h1 id="question" class="title">
        Will you be my Valentine?
      </h1>
      

      <div class="btnRow" id="btnRow">
        <button id="yesBtn" class="btn yes">YES </button>
        <button id="noBtn" class="btn no">NO </button>
      </div>

      <p class="hint">Tip: press no</p>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
